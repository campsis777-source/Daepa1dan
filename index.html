<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동물 그림자 찾기 게임</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a3e 0%, #2d2d6b 40%, #1a1a3e 100%);
        }

        /* 별 배경 */
        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 시작 화면 */
        #start-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #start-screen h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            color: #fff;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            animation: bounceTitle 2s ease-in-out infinite;
        }

        #start-screen .subtitle {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: #ffd700;
            margin-bottom: 40px;
        }

        .start-animals {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .start-animal {
            font-size: clamp(3rem, 8vw, 5rem);
            animation: bounceAnimal 1.5s ease-in-out infinite;
        }

        .start-animal:nth-child(2) { animation-delay: 0.2s; }
        .start-animal:nth-child(3) { animation-delay: 0.4s; }
        .start-animal:nth-child(4) { animation-delay: 0.6s; }
        .start-animal:nth-child(5) { animation-delay: 0.8s; }

        @keyframes bounceAnimal {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes bounceTitle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .start-btn {
            padding: 20px 60px;
            font-size: clamp(1.2rem, 3vw, 2rem);
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 50px;
            color: #333;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
            transition: all 0.3s;
        }

        .start-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 35px rgba(255, 215, 0, 0.6);
        }

        .start-btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* 게임 화면 */
        #game-screen {
            display: none;
            width: 100%;
            height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* 상단 바 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .score-display {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            color: #ffd700;
            font-weight: bold;
        }

        .round-display {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            color: #aac4ff;
        }

        .hint-btn {
            padding: 8px 20px;
            font-size: clamp(0.8rem, 2vw, 1rem);
            background: linear-gradient(135deg, #ff6b9d, #c44dff);
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .hint-btn:hover {
            transform: scale(1.1);
        }

        /* 게임 영역 */
        .game-area {
            display: flex;
            flex-direction: row;
            height: calc(100vh - 60px);
            padding: 15px;
            gap: 15px;
        }

        /* 그림자 영역 (왼쪽) */
        .shadow-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .shadow-label {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            color: #aac4ff;
            margin-bottom: 5px;
        }

        .shadow-card {
            width: clamp(120px, 25vw, 200px);
            height: clamp(120px, 25vw, 200px);
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px dashed rgba(255,255,255,0.2);
            position: relative;
            transition: all 0.3s;
        }

        .shadow-card.highlight {
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .shadow-card.correct {
            border-color: #4ade80;
            border-style: solid;
            background: rgba(74, 222, 128, 0.15);
        }

        .shadow-emoji {
            font-size: clamp(4rem, 12vw, 7rem);
            filter: brightness(0) invert(0);
            opacity: 0.6;
        }

        .shadow-card.correct .shadow-emoji {
            filter: none;
            opacity: 1;
        }

        .shadow-name {
            position: absolute;
            bottom: 8px;
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            color: rgba(255,255,255,0.5);
            font-weight: bold;
        }

        .shadow-card.correct .shadow-name {
            color: #4ade80;
        }

        /* 동물 선택 영역 (오른쪽) */
        .animals-area {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .animals-label {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            color: #ffd700;
            margin-bottom: 10px;
        }

        .animals-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(8px, 2vw, 15px);
            max-width: 500px;
        }

        .animal-card {
            width: clamp(80px, 15vw, 130px);
            height: clamp(80px, 15vw, 130px);
            background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 3px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .animal-card:hover {
            transform: translateY(-5px) scale(1.05);
            border-color: rgba(255, 215, 0, 0.5);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.2);
        }

        .animal-card.selected {
            border-color: #ffd700;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 170, 0, 0.1));
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            transform: scale(1.08);
        }

        .animal-card.matched {
            opacity: 0.3;
            pointer-events: none;
            transform: scale(0.9);
        }

        .animal-card.wrong {
            animation: shake 0.5s ease;
            border-color: #ff4444;
        }

        .animal-card.hint-glow {
            animation: hintPulse 1s ease-in-out 3;
            border-color: #ffd700;
        }

        @keyframes hintPulse {
            0%, 100% { box-shadow: 0 0 5px rgba(255, 215, 0, 0.3); }
            50% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.8); }
        }

        .animal-emoji {
            font-size: clamp(2.5rem, 7vw, 4rem);
        }

        .animal-name {
            font-size: clamp(0.6rem, 1.2vw, 0.85rem);
            color: rgba(255,255,255,0.7);
            margin-top: 2px;
            font-weight: bold;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }

        /* 정답 효과 */
        .celebration {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            animation: confettiFall var(--fall-duration) ease-out forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* 피드백 메시지 */
        .feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: bold;
            z-index: 60;
            pointer-events: none;
            animation: feedbackPop 1.2s ease-out forwards;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
        }

        .feedback.correct {
            color: #4ade80;
        }

        .feedback.wrong {
            color: #ff6b6b;
        }

        @keyframes feedbackPop {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-50%, -60%) scale(1); opacity: 0; }
        }

        /* 라운드 완료 화면 */
        #round-complete {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 80;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        #round-complete.show {
            display: flex;
        }

        .complete-content {
            text-align: center;
            animation: popIn 0.5s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .complete-emoji {
            font-size: clamp(4rem, 12vw, 8rem);
            animation: bounceAnimal 1s ease-in-out infinite;
        }

        .complete-text {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: #ffd700;
            margin: 15px 0;
            font-weight: bold;
        }

        .complete-score {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            color: #aac4ff;
            margin-bottom: 25px;
        }

        .next-btn {
            padding: 15px 50px;
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            background: linear-gradient(135deg, #4ade80, #22c55e);
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(74, 222, 128, 0.4);
            transition: all 0.3s;
        }

        .next-btn:hover {
            transform: translateY(-3px) scale(1.05);
        }

        /* 로딩 화면 */
        #loading-screen {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a3e 0%, #2d2d6b 40%, #1a1a3e 100%);
            z-index: 90;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #loading-screen.show {
            display: flex;
        }

        .loading-animals {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .loading-animal {
            font-size: clamp(2.5rem, 7vw, 4rem);
            animation: loadingBounce 1.2s ease-in-out infinite;
            opacity: 0.4;
        }

        .loading-animal:nth-child(1) { animation-delay: 0s; }
        .loading-animal:nth-child(2) { animation-delay: 0.15s; }
        .loading-animal:nth-child(3) { animation-delay: 0.3s; }
        .loading-animal:nth-child(4) { animation-delay: 0.45s; }
        .loading-animal:nth-child(5) { animation-delay: 0.6s; }

        @keyframes loadingBounce {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.4; }
            50% { transform: translateY(-25px) scale(1.2); opacity: 1; }
        }

        .loading-text {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 20px;
            animation: loadingPulse 1.5s ease-in-out infinite;
        }

        @keyframes loadingPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .loading-bar-container {
            width: clamp(200px, 50vw, 350px);
            height: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .loading-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd700, #ffaa00, #ffd700);
            border-radius: 10px;
            transition: width 0.3s ease;
            animation: loadingShimmer 1.5s ease-in-out infinite;
            background-size: 200% 100%;
        }

        @keyframes loadingShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .loading-tip {
            margin-top: 25px;
            font-size: clamp(0.8rem, 2vw, 1.1rem);
            color: #aac4ff;
            text-align: center;
            max-width: 300px;
        }

        /* 모바일 최적화 */
        @media (max-width: 600px) {
            .game-area {
                flex-direction: column;
                padding: 8px;
                gap: 8px;
            }

            .shadow-area {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
            }

            .shadow-card {
                width: clamp(80px, 20vw, 100px);
                height: clamp(80px, 20vw, 100px);
            }

            .shadow-emoji {
                font-size: clamp(2.5rem, 8vw, 4rem);
            }

            .animals-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }

            .animal-card {
                width: clamp(70px, 22vw, 100px);
                height: clamp(70px, 22vw, 100px);
            }

            .shadow-label, .animals-label {
                font-size: 0.9rem;
                margin-bottom: 3px;
            }
        }

        @media (max-width: 400px) {
            .shadow-card {
                width: 70px;
                height: 70px;
            }
            .shadow-emoji {
                font-size: 2.2rem;
            }
            .animal-card {
                width: 65px;
                height: 65px;
            }
            .animal-emoji {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- 별 배경 -->
    <div class="stars" id="stars"></div>

    <!-- 시작 화면 -->
    <div id="start-screen">
        <h1>동물 그림자 찾기</h1>
        <p class="subtitle">그림자를 보고 어떤 동물인지 맞춰보세요!</p>
        <div class="start-animals">
            <span class="start-animal">🐶</span>
            <span class="start-animal">🐱</span>
            <span class="start-animal">🐘</span>
            <span class="start-animal">🐰</span>
            <span class="start-animal">🦁</span>
        </div>
        <button class="start-btn" onclick="startGame()">게임 시작!</button>
    </div>

    <!-- 게임 화면 -->
    <div id="game-screen">
        <div class="top-bar">
            <div class="score-display">⭐ 점수: <span id="score">0</span></div>
            <div class="round-display">라운드 <span id="round">1</span> / <span id="total-rounds">5</span></div>
            <button class="hint-btn" onclick="showHint()">💡 힌트 (<span id="hint-count">3</span>)</button>
        </div>
        <div class="game-area">
            <div class="shadow-area">
                <div class="shadow-label">🌙 그림자를 봐봐!</div>
                <div id="shadow-container"></div>
            </div>
            <div class="animals-area">
                <div class="animals-label">🌟 어떤 동물일까?</div>
                <div class="animals-grid" id="animals-grid"></div>
            </div>
        </div>
    </div>

    <!-- 라운드 완료 -->
    <div id="round-complete">
        <div class="complete-content">
            <div class="complete-emoji" id="complete-emoji">🎉</div>
            <div class="complete-text" id="complete-text">잘했어요!</div>
            <div class="complete-score" id="complete-score"></div>
            <button class="next-btn" id="next-btn" onclick="nextRound()">다음 라운드 ▶</button>
        </div>
    </div>

    <!-- 로딩 화면 -->
    <div id="loading-screen">
        <div class="loading-animals">
            <span class="loading-animal">🐶</span>
            <span class="loading-animal">🐱</span>
            <span class="loading-animal">🐘</span>
            <span class="loading-animal">🐰</span>
            <span class="loading-animal">🦁</span>
        </div>
        <div class="loading-text" id="loading-text">동물 친구들을 부르고 있어요...</div>
        <div class="loading-bar-container">
            <div class="loading-bar" id="loading-bar"></div>
        </div>
        <div class="loading-tip" id="loading-tip">그림자를 잘 살펴보세요!</div>
    </div>

    <!-- 축하 효과 -->
    <div class="celebration" id="celebration"></div>

    <script>
        // 동물 데이터
        const allAnimals = [
            { emoji: '🐶', name: '강아지', sound: '멍멍!' },
            { emoji: '🐱', name: '고양이', sound: '야옹!' },
            { emoji: '🐘', name: '코끼리', sound: '뿌우!' },
            { emoji: '🐰', name: '토끼', sound: '깡충!' },
            { emoji: '🦁', name: '사자', sound: '어흥!' },
            { emoji: '🐸', name: '개구리', sound: '개굴!' },
            { emoji: '🐧', name: '펭귄', sound: '꽥꽥!' },
            { emoji: '🐷', name: '돼지', sound: '꿀꿀!' },
            { emoji: '🐻', name: '곰', sound: '크앙!' },
            { emoji: '🦊', name: '여우', sound: '깽!' },
            { emoji: '🐢', name: '거북이', sound: '느릿!' },
            { emoji: '🦋', name: '나비', sound: '팔랑!' },
            { emoji: '🐔', name: '닭', sound: '꼬끼오!' },
            { emoji: '🐴', name: '말', sound: '히힝!' },
            { emoji: '🐭', name: '쥐', sound: '찍찍!' },
            { emoji: '🦉', name: '부엉이', sound: '부엉!' },
            { emoji: '🐍', name: '뱀', sound: '스슥!' },
            { emoji: '🐬', name: '돌고래', sound: '끼릭!' },
            { emoji: '🦒', name: '기린', sound: '음매!' },
            { emoji: '🐝', name: '벌', sound: '붕붕!' },
        ];

        // 게임 상태
        let score = 0;
        let round = 1;
        let totalRounds = 5;
        let hints = 3;
        let currentShadow = null;
        let roundAnimals = [];
        let matchedCount = 0;
        let shadowQueue = [];
        let selectedCard = null;
        let isProcessing = false;

        // 오디오 컨텍스트
        let audioCtx = null;

        function getAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        // 효과음 생성
        function playSound(type) {
            try {
                const ctx = getAudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523, ctx.currentTime);
                    osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.setValueAtTime(150, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'complete') {
                    const notes = [523, 659, 784, 1047];
                    notes.forEach((freq, i) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.connect(g);
                        g.connect(ctx.destination);
                        o.type = 'sine';
                        o.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.15);
                        g.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.15);
                        g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.15 + 0.3);
                        o.start(ctx.currentTime + i * 0.15);
                        o.stop(ctx.currentTime + i * 0.15 + 0.3);
                    });
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.1);
                }
            } catch (e) {
                // 오디오 실패 시 무시
            }
        }

        // 별 배경 생성
        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.animationDelay = Math.random() * 3 + 's';
                container.appendChild(star);
            }
        }

        // 배열 셔플
        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 로딩 메시지들
        const loadingMessages = [
            '동물 친구들을 부르고 있어요...',
            '그림자를 만들고 있어요...',
            '숲 속에서 동물을 찾고 있어요...',
            '동물원에서 준비 중이에요...',
            '새로운 동물이 오고 있어요...',
        ];

        const loadingTips = [
            '그림자의 모양을 잘 살펴보세요!',
            '귀 모양이 힌트가 될 수 있어요!',
            '꼬리를 자세히 봐봐!',
            '동물 이름을 소리 내어 읽어봐!',
            '힌트 버튼을 누르면 도움을 받을 수 있어요!',
            '천천히 생각해도 괜찮아요!',
        ];

        // 로딩 화면 표시
        function showLoading(callback) {
            const loadingScreen = document.getElementById('loading-screen');
            const loadingBar = document.getElementById('loading-bar');
            const loadingText = document.getElementById('loading-text');
            const loadingTip = document.getElementById('loading-tip');

            // 랜덤 로딩 동물 이모지 선택
            const emojiSets = [
                ['🐶', '🐱', '🐘', '🐰', '🦁'],
                ['🐸', '🐧', '🐷', '🐻', '🦊'],
                ['🐢', '🦋', '🐔', '🐴', '🐭'],
                ['🦉', '🐍', '🐬', '🦒', '🐝'],
            ];
            const randomSet = emojiSets[Math.floor(Math.random() * emojiSets.length)];
            const loadingAnimals = loadingScreen.querySelectorAll('.loading-animal');
            loadingAnimals.forEach((el, i) => {
                el.textContent = randomSet[i];
            });

            loadingText.textContent = loadingMessages[Math.floor(Math.random() * loadingMessages.length)];
            loadingTip.textContent = loadingTips[Math.floor(Math.random() * loadingTips.length)];
            loadingBar.style.width = '0%';

            loadingScreen.classList.add('show');

            // 프로그레스 바 애니메이션
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 20 + 10;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    loadingBar.style.width = '100%';
                    setTimeout(() => {
                        loadingScreen.classList.remove('show');
                        if (callback) callback();
                    }, 300);
                } else {
                    loadingBar.style.width = progress + '%';
                }
            }, 200);
        }

        // 게임 시작
        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            score = 0;
            round = 1;
            hints = 3;
            updateUI();

            showLoading(() => {
                document.getElementById('game-screen').style.display = 'block';
                startRound();
            });
        }

        // 라운드 시작
        function startRound() {
            matchedCount = 0;
            selectedCard = null;
            isProcessing = false;

            // 이 라운드에 사용할 동물 3마리 선택
            const shuffled = shuffle(allAnimals);
            roundAnimals = shuffled.slice(0, 3);

            // 보기에 표시할 동물 (정답 3 + 오답 3 = 총 6개)
            const distractors = shuffled.slice(3, 6);
            const allChoices = shuffle([...roundAnimals, ...distractors]);

            // 그림자 큐 설정 (순서대로 맞추기)
            shadowQueue = [...roundAnimals];
            currentShadow = shadowQueue[0];

            renderShadow();
            renderAnimals(allChoices);
            updateUI();
        }

        // 그림자 렌더링
        function renderShadow() {
            const container = document.getElementById('shadow-container');
            container.innerHTML = '';

            const card = document.createElement('div');
            card.className = 'shadow-card highlight';
            card.id = 'current-shadow';
            card.innerHTML = `
                <span class="shadow-emoji">${currentShadow.emoji}</span>
                <span class="shadow-name">???</span>
            `;
            container.appendChild(card);
        }

        // 동물 카드 렌더링
        function renderAnimals(animals) {
            const grid = document.getElementById('animals-grid');
            grid.innerHTML = '';

            animals.forEach((animal, index) => {
                const card = document.createElement('div');
                card.className = 'animal-card';
                card.dataset.name = animal.name;
                card.dataset.emoji = animal.emoji;
                card.innerHTML = `
                    <span class="animal-emoji">${animal.emoji}</span>
                    <span class="animal-name">${animal.name}</span>
                `;
                card.onclick = () => selectAnimal(card, animal);
                card.style.animationDelay = (index * 0.05) + 's';
                grid.appendChild(card);
            });
        }

        // 동물 선택
        function selectAnimal(card, animal) {
            if (isProcessing || card.classList.contains('matched')) return;

            playSound('click');

            // 이전 선택 해제
            document.querySelectorAll('.animal-card.selected').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedCard = card;

            // 바로 체크
            checkMatch(card, animal);
        }

        // 매칭 확인
        function checkMatch(card, animal) {
            isProcessing = true;

            if (animal.name === currentShadow.name) {
                // 정답!
                playSound('correct');
                card.classList.remove('selected');
                card.classList.add('matched');

                const shadowCard = document.getElementById('current-shadow');
                shadowCard.classList.remove('highlight');
                shadowCard.classList.add('correct');
                shadowCard.querySelector('.shadow-name').textContent = animal.name;

                score += 10;
                matchedCount++;

                showFeedback('correct', `${animal.sound} 정답!`);
                spawnConfetti(15);

                setTimeout(() => {
                    if (matchedCount < shadowQueue.length) {
                        // 다음 그림자
                        currentShadow = shadowQueue[matchedCount];
                        renderShadow();
                        isProcessing = false;
                    } else {
                        // 라운드 완료
                        completeRound();
                    }
                }, 800);
            } else {
                // 오답
                playSound('wrong');
                card.classList.remove('selected');
                card.classList.add('wrong');
                showFeedback('wrong', '다시 해봐!');

                setTimeout(() => {
                    card.classList.remove('wrong');
                    isProcessing = false;
                }, 600);
            }

            updateUI();
        }

        // 힌트
        function showHint() {
            if (hints <= 0 || !currentShadow) return;
            hints--;
            document.getElementById('hint-count').textContent = hints;

            // 정답 카드에 반짝임 효과
            const cards = document.querySelectorAll('.animal-card:not(.matched)');
            cards.forEach(card => {
                if (card.dataset.name === currentShadow.name) {
                    card.classList.add('hint-glow');
                    setTimeout(() => card.classList.remove('hint-glow'), 3000);
                }
            });

            playSound('click');
        }

        // 피드백 메시지
        function showFeedback(type, text) {
            const el = document.createElement('div');
            el.className = `feedback ${type}`;
            el.textContent = text;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1200);
        }

        // 색종이 효과
        function spawnConfetti(count) {
            const container = document.getElementById('celebration');
            const colors = ['#ff6b6b', '#ffd700', '#4ade80', '#60a5fa', '#c084fc', '#fb923c'];

            for (let i = 0; i < count; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '-10px';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.setProperty('--fall-duration', (Math.random() * 1.5 + 1) + 's');
                confetti.style.width = (Math.random() * 10 + 5) + 'px';
                confetti.style.height = (Math.random() * 10 + 5) + 'px';
                container.appendChild(confetti);
                setTimeout(() => confetti.remove(), 3000);
            }
        }

        // 라운드 완료
        function completeRound() {
            playSound('complete');
            spawnConfetti(50);

            setTimeout(() => {
                const completeScreen = document.getElementById('round-complete');
                const emojis = ['🎉', '🥳', '👏', '🌟', '💖'];
                const texts = ['대단해요!', '최고예요!', '잘했어요!', '멋져요!', '천재!'];
                const idx = Math.floor(Math.random() * emojis.length);

                document.getElementById('complete-emoji').textContent = emojis[idx];
                document.getElementById('complete-text').textContent = texts[idx];
                document.getElementById('complete-score').textContent = `현재 점수: ⭐ ${score}점`;

                if (round >= totalRounds) {
                    document.getElementById('next-btn').textContent = '🏆 결과 보기';
                    document.getElementById('next-btn').onclick = showFinalResult;
                } else {
                    document.getElementById('next-btn').textContent = '다음 라운드 ▶';
                    document.getElementById('next-btn').onclick = nextRound;
                }

                completeScreen.classList.add('show');
            }, 600);
        }

        // 다음 라운드
        function nextRound() {
            document.getElementById('round-complete').classList.remove('show');
            document.getElementById('game-screen').style.display = 'none';
            round++;
            updateUI();

            showLoading(() => {
                document.getElementById('game-screen').style.display = 'block';
                startRound();
            });
        }

        // 최종 결과
        function showFinalResult() {
            const completeScreen = document.getElementById('round-complete');
            let emoji, text;

            if (score >= totalRounds * 30) {
                emoji = '🏆';
                text = '완벽해요! 동물 박사!';
            } else if (score >= totalRounds * 20) {
                emoji = '🌟';
                text = '정말 잘했어요!';
            } else {
                emoji = '💪';
                text = '잘했어요! 다시 해볼까?';
            }

            document.getElementById('complete-emoji').textContent = emoji;
            document.getElementById('complete-text').textContent = text;
            document.getElementById('complete-score').textContent = `최종 점수: ⭐ ${score}점`;
            document.getElementById('next-btn').textContent = '🔄 다시 하기';
            document.getElementById('next-btn').onclick = () => {
                completeScreen.classList.remove('show');
                document.getElementById('game-screen').style.display = 'none';
                score = 0;
                round = 1;
                hints = 3;
                document.getElementById('hint-count').textContent = hints;
                updateUI();

                showLoading(() => {
                    document.getElementById('game-screen').style.display = 'block';
                    startRound();
                });
            };

            spawnConfetti(80);
        }

        // UI 업데이트
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('round').textContent = round;
            document.getElementById('total-rounds').textContent = totalRounds;
        }

        // 초기화
        createStars();
    </script>
</body>
</html>
